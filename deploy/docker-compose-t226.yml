# T226 Infrastructure: CWSO + Polar rollout (phase2/phase4 sidecars + capture)
# Usage:
#   source deploy/t226-phase2.env
#   docker compose -f deploy/docker-compose-t226.yml up -d
#
# This compose stack brings up:
#   - cwso-orchestrator (port 8080): main orchestration server
#   - cwso-git-shadow (phase2): Git conflict detection sidecar
#   - cwso-merge-engine (phase4): Merge orchestration sidecar
#   - cwso-rollout (port 8787): rollout proxy with Parquet trajectory capture

name: cwso-t226

secrets:
  jwt_secret:
    file: /home/emage/Code/emage/CWSO/.env.jwt.dev  # Dev JWT secret for MCP authentication
    # POC-DEBT: File-based secret acceptable for dev/testing; production must use secure vault

services:
  # Main orchestration server
  orchestrator:
    image: cwso/orchestrator:dev
    build:
      context: /home/emage/Code/emage/CWSO
      dockerfile: deploy/Dockerfile.orchestrator
    container_name: cwso-orchestrator
    ports:
      - "8080:8080"
    environment:
      CWSO_TRANSPORT: "http"
      CWSO_HTTP_ADDR: ":8080"
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
      CWSO_JWT_ALG: "HS256"
      CWSO_JWT_ISSUER: "cwso"
      CWSO_JWT_AUDIENCE: "cwso-mcp"
      CWSO_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8080,http://docker:8080"
      CWSO_WORKSPACE: "/workspace"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      
      # Phase 2: Rollout API integration
      CWSO_ROLLOUT_API_ENABLED: "${CWSO_ROLLOUT_API_ENABLED:-true}"
      CWSO_ROLLOUT_REWARD_ENABLED: "${CWSO_ROLLOUT_REWARD_ENABLED:-true}"
      CWSO_ROLLOUT_SOCKET: "/run/cwso/rollout.sock"
      
      # Phase 4: Merge orchestration
      CWSO_MERGE_ORCHESTRATION_ENABLED: "${CWSO_MERGE_ORCHESTRATION_ENABLED:-true}"
    secrets:
      - jwt_secret
    volumes:
      - /home/emage/Code/emage/CWSO/sample-workspace:/workspace:ro
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      git-shadow:
        condition: service_started
      merge-engine:
        condition: service_started

  # Phase 2: Git conflict detection sidecar
  git-shadow:
    image: cwso/git-shadow:dev
    build:
      context: /home/emage/Code/emage/CWSO
      dockerfile: deploy/Dockerfile.git-shadow
    container_name: cwso-git-shadow
    environment:
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      CWSO_IPC_ALLOWED_GIDS: "0,100"
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
    volumes:
      - cwso-runtime:/run/cwso
    tmpfs:
      - /var/lib/cwso/shadow:size=256m,mode=1777
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # Phase 4: Merge orchestration sidecar
  merge-engine:
    image: cwso/merge-engine:dev
    build:
      context: /home/emage/Code/emage/CWSO
      dockerfile: deploy/Dockerfile.merge-engine
    container_name: cwso-merge-engine
    environment:
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      CWSO_IPC_ALLOWED_GIDS: "0,100"
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
    volumes:
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # Rollout proxy with Parquet trajectory capture
  rollout:
    image: cwso/rollout:dev
    build:
      context: /home/emage/Code/emage/CWSO
      dockerfile: deploy/Dockerfile.rollout
    container_name: cwso-rollout
    ports:
      - "${CWSO_ROLLOUT_HTTP_BIND_PORT:-8787}:8787"
    environment:
      # Rollout proxy configuration
      CWSO_ROLLOUT_PROXY_ENABLED: "${CWSO_ROLLOUT_PROXY_ENABLED:-true}"
      CWSO_ROLLOUT_HTTP_BIND: "0.0.0.0:8787"
      CWSO_ROLLOUT_UPSTREAM_URL: "${CWSO_ROLLOUT_UPSTREAM_URL:-http://127.0.0.1:18080}"
      CWSO_ROLLOUT_UPSTREAM_API_KEY: "${CWSO_ROLLOUT_UPSTREAM_API_KEY:-}"
      
      # Parquet capture configuration
      CWSO_ROLLOUT_TRAJECTORY_STORE_ENABLED: "${CWSO_ROLLOUT_TRAJECTORY_STORE_ENABLED:-true}"
      CWSO_ROLLOUT_TRAJECTORY_STORE_PATH: "${CWSO_ROLLOUT_TRAJECTORY_STORE_PATH:-/data/parquet-store}"
      CWSO_ROLLOUT_CAPTURE_ENABLED: "${CWSO_ROLLOUT_CAPTURE_ENABLED:-true}"
      CWSO_ROLLOUT_DEFAULT_SESSION_ID: "${CWSO_ROLLOUT_DEFAULT_SESSION_ID:-t226-live-session}"
      
      # Logging
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      # Mount Parquet store to host (queryable from T228 live integration tests)
      - "${PARQUET_STORE_HOST_PATH:-/tmp/t226-parquet-store}:/data/parquet-store"
      # Optional: Unix socket for MCP integration (if needed)
      - cwso-runtime:/run/cwso
    read_only: false  # Rollout needs write access to store Parquet files
    cap_drop: ["ALL"]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/v1/models"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  cwso-runtime:
    driver: local
