# T226 Infrastructure: CWSO + Polar rollout (phase2/phase4 sidecars + capture)
# Usage:
#   source deploy/t226-phase2.env
#   export CWSO_JWT_SECRET=...   # from your secret store; required by `up`
#   docker compose -f deploy/docker-compose-t226.yml up -d
#
# The JWT secret comes from the CWSO_JWT_SECRET environment variable of the
# `docker compose` process (or the project .env next to this file) and is
# mounted into the services as /run/secrets/jwt_secret. There is no secret
# file default (T694); `up` fails when the variable is not set.
#
# This compose stack brings up:
#   - cwso-orchestrator (port 8080): main orchestration server
#   - cwso-git-shadow (phase2): Git conflict detection sidecar
#   - cwso-merge-engine (phase4): Merge orchestration sidecar
#   - cwso-rollout (port 8787): rollout proxy with Parquet trajectory capture

name: cwso-t226

secrets:
  jwt_secret:
    environment: CWSO_JWT_SECRET  # JWT secret for MCP authentication (T694: no file default)
    # POC-DEBT: Environment-sourced secret acceptable for dev/testing; production must use secure vault

services:
  # Main orchestration server
  orchestrator:
    image: registry.gitlab.com/em-age/emage.code.cwso/orchestrator:v0.5.2
    container_name: cwso-orchestrator
    ports:
      - "8080:8080"
    environment:
      CWSO_TRANSPORT: "http"
      CWSO_HTTP_ADDR: ":8080"
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
      CWSO_JWT_ALG: "HS256"
      CWSO_JWT_ISSUER: "cwso"
      CWSO_JWT_AUDIENCE: "cwso-mcp"
      CWSO_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8080,http://docker:8080,http://orchestrator,http://orchestrator:8080"
      CWSO_WORKSPACE: "/workspace"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"

      # Phase 2: Rollout API integration
      CWSO_ROLLOUT_API_ENABLED: "${CWSO_ROLLOUT_API_ENABLED:-true}"
      CWSO_ROLLOUT_REWARD_ENABLED: "${CWSO_ROLLOUT_REWARD_ENABLED:-true}"
      CWSO_ROLLOUT_SOCKET: "/run/cwso/rollout.sock"

      # Phase 2: Execution gateway & trajectory builder (T146, T149)
      CWSO_ROLLOUT_GATEWAY_STAGING_ENABLED: "${CWSO_ROLLOUT_GATEWAY_STAGING_ENABLED:-true}"
      CWSO_ROLLOUT_EVALUATOR_REGISTRY_ENABLED: "${CWSO_ROLLOUT_EVALUATOR_REGISTRY_ENABLED:-true}"
      CWSO_ROLLOUT_TRAJECTORY_BUILDER_ENABLED: "${CWSO_ROLLOUT_TRAJECTORY_BUILDER_ENABLED:-true}"
      CWSO_ROLLOUT_TRAJECTORY_BUILDER_STRATEGY: "${CWSO_ROLLOUT_TRAJECTORY_BUILDER_STRATEGY:-per_request}"

      # Phase 4: Merge orchestration
      CWSO_MERGE_ORCHESTRATION_ENABLED: "${CWSO_MERGE_ORCHESTRATION_ENABLED:-true}"
    secrets:
      - jwt_secret
    volumes:
      - /home/emage/Code/emage/CWSO/sample-workspace:/workspace:ro
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      git-shadow:
        condition: service_started
      merge-engine:
        condition: service_started

  # Phase 2: Git conflict detection sidecar
  git-shadow:
    image: registry.gitlab.com/em-age/emage.code.cwso/git-shadow:v0.5.2
    container_name: cwso-git-shadow
    environment:
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      CWSO_IPC_ALLOWED_GIDS: "0,100"
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
    volumes:
      - cwso-runtime:/run/cwso
    tmpfs:
      - /var/lib/cwso/shadow:size=256m,mode=1777
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # Phase 4: Merge orchestration sidecar
  merge-engine:
    image: registry.gitlab.com/em-age/emage.code.cwso/merge-engine:v0.5.2
    container_name: cwso-merge-engine
    environment:
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      CWSO_IPC_ALLOWED_GIDS: "0,100"
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
    volumes:
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # Rollout proxy with Parquet trajectory capture
  rollout:
    image: registry.gitlab.com/em-age/emage.code.cwso/rollout:v0.5.2
    container_name: cwso-rollout
    ports:
      - "${CWSO_ROLLOUT_HTTP_BIND_PORT:-8787}:8787"
    environment:
      # Rollout proxy configuration
      CWSO_ROLLOUT_PROXY_ENABLED: "${CWSO_ROLLOUT_PROXY_ENABLED:-true}"
      CWSO_ROLLOUT_HTTP_BIND: "0.0.0.0:8787"
      CWSO_ROLLOUT_UPSTREAM_URL: "${CWSO_ROLLOUT_UPSTREAM_URL:-http://127.0.0.1:18080}"
      CWSO_ROLLOUT_UPSTREAM_API_KEY: "${CWSO_ROLLOUT_UPSTREAM_API_KEY:-}"
      CWSO_ROLLOUT_ALLOW_INSECURE_ENDPOINTS: "${CWSO_ROLLOUT_ALLOW_INSECURE_ENDPOINTS:-false}"

      # Parquet capture configuration
      CWSO_ROLLOUT_TRAJECTORY_STORE_ENABLED: "${CWSO_ROLLOUT_TRAJECTORY_STORE_ENABLED:-true}"
      CWSO_ROLLOUT_TRAJECTORY_STORE_PATH: "${CWSO_ROLLOUT_TRAJECTORY_STORE_PATH:-/data/parquet-store}"
      CWSO_ROLLOUT_CAPTURE_ENABLED: "${CWSO_ROLLOUT_CAPTURE_ENABLED:-true}"
      CWSO_ROLLOUT_DEFAULT_SESSION_ID: "${CWSO_ROLLOUT_DEFAULT_SESSION_ID:-t226-live-session}"

      # Logging
      CWSO_LOG_LEVEL: "${CWSO_LOG_LEVEL:-info}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      # Mount Parquet store to host (queryable from T228 live integration tests)
      - "${PARQUET_STORE_HOST_PATH:-/tmp/t226-parquet-store}:/data/parquet-store"
      # Optional: Unix socket for MCP integration (if needed)
      - cwso-runtime:/run/cwso
    read_only: false  # Rollout needs write access to store Parquet files
    cap_drop: ["ALL"]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 2: Minimal SIA executor service (PoC for T223 harness launcher)
  # This service registers as a node with the gateway and processes sessions
  sia-executor:
    image: python:3.11-slim
    container_name: cwso-sia-executor
    working_dir: /workspace
    environment:
      CWSO_URL: "http://orchestrator:8080"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/implementation:/adapters"
      ANTHROPIC_BASE_URL: "http://rollout:8787"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SIA_BASELINE_MODEL: "${SIA_BASELINE_MODEL:-claude-3-haiku-20240307}"
      SIA_FINE_TUNED_MODEL: "${SIA_FINE_TUNED_MODEL:-claude-3-haiku-20240307}"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -eu
        echo "=== SIA Executor Container Starting ==="
        echo "Workspace: $(pwd)"
        echo "PYTHONPATH: $$PYTHONPATH"
        echo "Files: $(ls -la)"
        # No xtrace and no fallback value: the secret is never echoed (T694).
        CWSO_JWT_SECRET="$$(tr -d '\r\n' < /run/secrets/jwt_secret 2>/dev/null || true)"
        if [ -z "$$CWSO_JWT_SECRET" ]; then
          echo "ERROR: /run/secrets/jwt_secret is missing or empty; set CWSO_JWT_SECRET for docker compose" >&2
          exit 1
        fi
        export CWSO_JWT_SECRET
        echo "Running executor..."
        exec python3 sia-executor.py \
          --cwso-url http://orchestrator:8080 \
          --node-id sia-executor-1 \
          --mock-delay 1.5 \
          --poll-interval 2.0
    secrets:
      - jwt_secret
    volumes:
      - /home/emage/Code/emage/emage.code/implementation/scripts:/workspace
      - /home/emage/Code/emage/emage.code/implementation/adapters:/adapters:ro
      - /home/emage/Code/emage/emage.code/implementation:/implementation:ro
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: on-failure:3
    # POC-DEBT: Entrypoint exports the mounted secret as CWSO_JWT_SECRET; production must use proper secret injection

volumes:
  cwso-runtime:
    driver: local
