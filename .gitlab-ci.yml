# ────────────────────────────────────────────────────────────────────────────
# emage.code — GitLab CI pipeline
#
# Stages:
#   lint        — markdown link check (informational)
#   test        — functional + performance tests
#   verify      — drift + validation super-gate (BLOCKING)
#   sync        — re-run sync and assert no diff (BLOCKING)
#   wiki-sync   — push docs/wiki/*.md to the project Wiki (develop only)
#   release     — generate CHANGELOG and create GitLab Release (on tag vX.Y.Z)
# ────────────────────────────────────────────────────────────────────────────

# Supply-chain pins (T675, SEC-T650-04; T676, SEC-T675-03 and SEC-T675-09). Every image is pinned
# by the digest of its multi-arch index (tag kept for readers; the digest is what is pulled).
# Digests read from the Docker Hub registry API on 2026-10-22 (python:3.12-alpine was bumped from the
# 2026-10-16 digest at the same time); each was re-fetched and its body hashes to the digest. Alpine in
# each image: node:24-alpine = 3.24.3 (Node 24.22.1), python:3.12-alpine = 3.24.3 (Python 3.12.15).
# ci_images_reviewed_on: 2026-10-22   (tests/functional/test_ci_hash_pins.py fails when this is older than 120 days)
# Both bases are supported (T676 replaced the end-of-life node:20-alpine and alpine:3.20: the jobs
# that held WIKI_TOKEN or ran the repository's Python scripts now share the one python image, which
# is also the interpreter the tests run on). Every `apk add` package carries a fuzzy `~=MAJOR.MINOR`
# pin (`nodejs` and `docker-cli`: MAJOR): an exact `=` pin breaks as soon as Alpine ships a security
# rebuild of the same upstream version, which would fail the release job. To bump an image:
# re-read the digest, read the Alpine version of its base layer, re-read the package versions
# in that branch's APKINDEX, and change digest and pins together. Do not add an unpinned
# image or `apk add` (tests/functional/test_publish_release.py fails on it).
# Python packages: every `pip install` goes through `--require-hashes -r ci/requirements-*.txt`,
# the hash-locked output of ci/requirements-*.in (tests/functional/test_ci_hash_pins.py fails on a
# floating install). To change a package, regenerate the lock (docs/wiki/mcp-pin-bump-checklist.md).

stages:
  - lint
  - test
  - verify
  - sync
  - wiki-sync
  - release

default:
  image: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
  interruptible: true
  tags:
    - docker

variables:
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: none

markdown-links:
  stage: lint
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  allow_failure: true
  script:
    - |
      python3 - <<'PY'
      import os, re, sys
      SKIP = ("/.git", "node_modules", ".vscode-server", "/docs/wiki")
      link_re = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
      fence_re = re.compile(r'```.*?```', re.DOTALL)
      inline_re = re.compile(r'`[^`\n]*`')
      broken = []
      for root, dirs, files in os.walk("."):
          if any(s in root for s in SKIP): continue
          for f in files:
              if not f.endswith(".md"): continue
              p = os.path.join(root, f)
              with open(p, encoding="utf-8", errors="ignore") as fh:
                  text = fh.read()
              text = fence_re.sub("", text)
              text = inline_re.sub("", text)
              base = os.path.dirname(p)
              for m in link_re.finditer(text):
                  t = m.group(2).strip()
                  if t.startswith(("http://","https://","mailto:","#","tel:")): continue
                  clean = t.split("#")[0].split("?")[0]
                  if not clean: continue
                  full = os.path.normpath(os.path.join(base, clean))
                  if not os.path.exists(full):
                      broken.append(f"{p}  ->  {t}")
      if broken:
          print("Broken markdown links:")
          for b in broken: print("  ", b)
          sys.exit(1)
      print("All markdown links resolve.")
      PY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

unit-tests:
  stage: test
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  tags:
    - dind  # Docker socket binding for T223 docker availability test
  variables:
    # dind runners bind the host Docker socket (Option A); point the CLI at it.
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - apk add --no-cache 'git~=2.54' 'bash~=5.3' 'nodejs~=24' 'docker-cli~=29' 'ripgrep~=15.1'
    # ripgrep and mcp==2.2.0 (the version in implementation/runtime/security/requirements-mcp-server.txt)
    # let the grep_content and live audit-server tests run here; with CI set they fail instead of skipping.
    # test_install_cursor_removal installs a real `git archive v8.0.0` tree; GIT_DEPTH is shallow and
    # tags are not fetched by default (the test FAILS in CI when the tag is missing).
    - git fetch --depth=1 origin tag v8.0.0
    # Hash-locked (SEC-T675-09): the job binds the host Docker socket, so nothing floats. The lock holds
    # pyyaml, jsonschema, requests, pyarrow, cryptography and mcp==2.2.0 with every transitive dependency.
    - 'python3 -m pip install --no-cache-dir --disable-pip-version-check --require-hashes --only-binary=:all: -r ci/requirements-ci.txt'
  script:
    - python3 tests/run.py
  artifacts:
    when: always
    paths:
      - tests/_reports/*.json
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

verify-knowledge-drift:
  stage: verify
  script:
    - node implementation/scripts/verify.mjs --root implementation
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

validation-super-gate:
  stage: verify
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  before_script:
    - 'python3 -m pip install --no-cache-dir --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r ci/requirements-gate.txt'
  script:
    - python3 implementation/scripts/check.py --root implementation --required --schemas --cookbooks --handoff-security --hook-policy --telemetry --benchmarks --registry --maturity --packaging --triggers --adapters
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

main-develop-drift-check:
  stage: verify
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  variables:
    GIT_DEPTH: "1"
  before_script:
    - apk add --no-cache 'git~=2.54'
  script:
    - git fetch origin main develop --depth=1
    - git fetch --force origin 'refs/tags/*:refs/tags/*'
    - python3 scripts/check-main-develop-drift.py --main-ref origin/main --develop-ref origin/develop
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'

sync-no-diff:
  stage: sync
  needs: ["verify-knowledge-drift", "validation-super-gate"]
  before_script:
    - apk add --no-cache 'git~=2.54'
  script:
    - node implementation/scripts/sync.mjs --root implementation
    - |
      if ! git diff --quiet; then
        echo "ERROR: sync produced changes that were not committed."
        echo "Run 'make sync' locally and commit the result."
        git --no-pager diff --stat
        exit 1
      fi
    - echo "Sync output matches committed platform folders."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

wiki-sync:
  stage: wiki-sync
  needs: ["sync-no-diff"]
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  script:
    - |
      if [ -z "$WIKI_TOKEN" ]; then
        echo "WIKI_TOKEN is not set — skipping wiki sync."
        exit 0
      fi
    - python3 scripts/sync-wiki.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/wiki/**/*
        - scripts/sync-wiki.py
        - .gitlab-ci.yml
  allow_failure: true

release-docs-gate:
  stage: release
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  script:
    - python3 scripts/verify-release-docs.py --tag "${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/'

main-develop-drift-gate:
  stage: release
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  variables:
    GIT_DEPTH: "1"
  before_script:
    - apk add --no-cache 'git~=2.54'
  script:
    - git fetch origin main develop --depth=1
    - git fetch --force origin 'refs/tags/*:refs/tags/*'
    - python3 scripts/check-main-develop-drift.py --main-ref origin/main --develop-ref origin/develop
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/'

release:
  stage: release
  needs: ["release-docs-gate", "main-develop-drift-gate"]
  image: python:3.12-alpine@sha256:92abd2ba1bdfb48b1e2ac224b582dd1558d0d4bb11c903b126b5bf9c448fd656
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python3 -I -c "import os, shutil, subprocess; apk=shutil.which('apk'); env=dict(i for i in os.environ.items() if i[0] != 'WIKI_TOKEN'); subprocess.check_call([apk, 'add', '--no-cache', 'git~=2.54'], env=env) if apk else None"
  script:
    # The token is read from the environment by name (--token-env); its value is never in argv.
    - python3 scripts/publish-release.py --tag "${CI_COMMIT_TAG}" --api-v4-url "${CI_API_V4_URL}" --expected-host "${CI_SERVER_HOST}" --project-id "${CI_PROJECT_ID}" --token-env WIKI_TOKEN
  artifacts:
    paths:
      - CHANGELOG.md
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/'
