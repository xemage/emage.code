# ────────────────────────────────────────────────────────────────────────────
# emage.code — GitLab CI pipeline
#
# Verifies that the generated platform folders (.github, .gemini, .opencode,
# .cursor) are in sync with the canonical knowledge base under
# v2/implementation/knowledge/. Also runs a markdown link check.
#
# Pipeline stages:
#   lint    — markdown link check (non-blocking informational)
#   verify  — run scripts/verify.mjs (BLOCKING — fails on knowledge drift)
#   sync    — re-run scripts/sync.mjs and assert no diff (BLOCKING)
# ────────────────────────────────────────────────────────────────────────────

stages:
  - lint
  - verify
  - sync

default:
  image: node:20-alpine
  interruptible: true
  tags:
    - saas-linux-small-amd64

variables:
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: none

# ── Lint ──────────────────────────────────────────────────────────────────
markdown-links:
  stage: lint
  allow_failure: true        # informational only — does not block merges
  before_script:
    - apk add --no-cache python3
  script:
    - |
      python3 - <<'PY'
      import os, re, sys
      SKIP = ("/.git", "node_modules", ".vscode-server", "/v1/")
      link_re = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
      broken = []
      for root, dirs, files in os.walk("."):
          if any(s in root for s in SKIP): continue
          for f in files:
              if not f.endswith(".md"): continue
              p = os.path.join(root, f)
              with open(p, encoding="utf-8", errors="ignore") as fh:
                  text = fh.read()
              base = os.path.dirname(p)
              for m in link_re.finditer(text):
                  t = m.group(2).strip()
                  if t.startswith(("http://","https://","mailto:","#","tel:")): continue
                  clean = t.split("#")[0].split("?")[0]
                  if not clean: continue
                  full = os.path.normpath(os.path.join(base, clean))
                  if not os.path.exists(full):
                      broken.append(f"{p}  ->  {t}")
      if broken:
          print("Broken markdown links (excluding v1):")
          for b in broken: print("  ", b)
          sys.exit(1)
      print("All markdown links resolve.")
      PY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ── Verify (drift gate) ───────────────────────────────────────────────────
verify-knowledge-drift:
  stage: verify
  script:
    - cd v2/implementation
    - node scripts/verify.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ── Sync sanity (re-run sync, assert no diff) ─────────────────────────────
sync-no-diff:
  stage: sync
  needs: ["verify-knowledge-drift"]
  before_script:
    - apk add --no-cache git
  script:
    - cd v2/implementation
    - node scripts/sync.mjs
    - cd "$CI_PROJECT_DIR"
    - |
      if ! git diff --quiet; then
        echo "ERROR: 'sync.mjs' produced changes that were not committed."
        echo "Run 'cd v2/implementation && node scripts/sync.mjs' locally and commit the result."
        git --no-pager diff --stat
        exit 1
      fi
    - echo "Sync output matches committed platform folders."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
