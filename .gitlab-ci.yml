# ────────────────────────────────────────────────────────────────────────────
# emage.code — GitLab CI pipeline
#
# Stages:
#   lint        — markdown link check (informational)
#   test        — functional + performance tests
#   verify      — drift + validation super-gate (BLOCKING)
#   sync        — re-run sync and assert no diff (BLOCKING)
#   wiki-sync   — push docs/wiki/*.md to the project Wiki (develop only)
#   release     — generate CHANGELOG and create GitLab Release (on tag vX.Y.Z)
# ────────────────────────────────────────────────────────────────────────────

stages:
  - lint
  - test
  - verify
  - sync
  - wiki-sync
  - release

default:
  image: node:20-alpine
  interruptible: true
  tags:
    - docker

variables:
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: none

markdown-links:
  stage: lint
  allow_failure: true
  before_script:
    - apk add --no-cache python3
  script:
    - |
      python3 - <<'PY'
      import os, re, sys
      SKIP = ("/.git", "node_modules", ".vscode-server", "/docs/wiki")
      link_re = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
      fence_re = re.compile(r'```.*?```', re.DOTALL)
      inline_re = re.compile(r'`[^`\n]*`')
      broken = []
      for root, dirs, files in os.walk("."):
          if any(s in root for s in SKIP): continue
          for f in files:
              if not f.endswith(".md"): continue
              p = os.path.join(root, f)
              with open(p, encoding="utf-8", errors="ignore") as fh:
                  text = fh.read()
              text = fence_re.sub("", text)
              text = inline_re.sub("", text)
              base = os.path.dirname(p)
              for m in link_re.finditer(text):
                  t = m.group(2).strip()
                  if t.startswith(("http://","https://","mailto:","#","tel:")): continue
                  clean = t.split("#")[0].split("?")[0]
                  if not clean: continue
                  full = os.path.normpath(os.path.join(base, clean))
                  if not os.path.exists(full):
                      broken.append(f"{p}  ->  {t}")
      if broken:
          print("Broken markdown links:")
          for b in broken: print("  ", b)
          sys.exit(1)
      print("All markdown links resolve.")
      PY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

unit-tests:
  stage: test
  image: python:3.12-alpine
  before_script:
    - python3 -c "import shutil, subprocess; apk=shutil.which('apk'); subprocess.check_call([apk, 'add', '--no-cache', 'nodejs', 'git']) if apk else None"
    - python3 -m pip install --no-cache-dir --quiet pyyaml jsonschema
  script:
    - python3 tests/run.py
  artifacts:
    when: always
    paths:
      - tests/_reports/*.json
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

verify-knowledge-drift:
  stage: verify
  script:
    - node implementation/scripts/verify.mjs --root implementation
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

validation-super-gate:
  stage: verify
  image: python:3.12-alpine
  before_script:
    - python3 -m pip install --no-cache-dir --quiet pyyaml jsonschema
  script:
    - python3 implementation/scripts/check.py --root implementation --required --schemas --cookbooks --handoff-security --hook-policy --telemetry --benchmarks --registry --packaging --triggers --adapters
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

sync-no-diff:
  stage: sync
  needs: ["verify-knowledge-drift", "validation-super-gate"]
  before_script:
    - apk add --no-cache git
  script:
    - node implementation/scripts/sync.mjs --root implementation
    - |
      if ! git diff --quiet; then
        echo "ERROR: sync produced changes that were not committed."
        echo "Run 'make sync' locally and commit the result."
        git --no-pager diff --stat
        exit 1
      fi
    - echo "Sync output matches committed platform folders."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

wiki-sync:
  stage: wiki-sync
  needs: ["sync-no-diff"]
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl python3 jq
  script:
    - |
      if [ -z "$WIKI_TOKEN" ]; then
        echo "WIKI_TOKEN is not set — skipping wiki sync."
        exit 0
      fi
    - python3 scripts/sync-wiki.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/wiki/**/*
        - scripts/sync-wiki.py
        - .gitlab-ci.yml
  allow_failure: true

release-docs-gate:
  stage: release
  image: alpine:3.20
  before_script:
    - apk add --no-cache python3
  script:
    - python3 scripts/verify-release-docs.py --tag "${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/'

release:
  stage: release
  needs: ["release-docs-gate"]
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python3 -c "import shutil, subprocess; apk=shutil.which('apk'); subprocess.check_call([apk, 'add', '--no-cache', 'git']) if apk else None"
  script:
    - python3 scripts/publish-release.py --tag "${CI_COMMIT_TAG}" --api-v4-url "${CI_API_V4_URL}" --project-id "${CI_PROJECT_ID}" --token "${WIKI_TOKEN}"
  artifacts:
    paths:
      - CHANGELOG.md
      - release-notes.md
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$/'
