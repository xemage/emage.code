# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commits.
# Used by the `release` job in .gitlab-ci.yml on tag pushes (vX.Y.Z).

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Commits follow [Conventional Commits](https://www.conventionalcommits.org/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat",       group = "Features" },
  { message = "^fix",        group = "Bug Fixes" },
  { message = "^perf",       group = "Performance" },
  { message = "^refactor",   group = "Refactor" },
  { message = "^docs",       group = "Documentation" },
  { message = "^test",       group = "Tests" },
  { message = "^ci",         group = "CI" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore",      group = "Chores", skip = false },
  { message = "^revert",     group = "Reverts" },
  { message = "^style",      group = "Styling", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "Breaking Changes" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "newest"
