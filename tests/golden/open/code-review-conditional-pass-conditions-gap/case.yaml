known_failing_reason: >-
  code-review.md requires "If CONDITIONAL_PASS, list the conditions, each with an owner and a
  due point." (as amended by T582, A4) but still defines no structured field/section convention
  for it: its VERDICT template has no "**Conditions**:" field. A CONDITIONAL_PASS review
  with conditions only alluded to in prose has no checkable "**Conditions**:" field or
  "## Conditions" section to verify against -- a contract gap, not a reviewer mistake.
