# MCP server registry — canonical source
#
# Each entry maps to one server. The sync engine projects this file into:
#   - .vscode/mcp.json           (VS Code / GitHub Copilot format)
#   - .gemini/settings.json      (Gemini mcpServers + hooks)
#   - .opencode/opencode.json    (Opencode mcp + instructions)
#   - .cursor/mcp.json           (Cursor mcpServers format)
#
# Tags select which platforms / profiles include a server:
#   core     — always emitted to every platform
#   extended — only emitted when the platform manifest opts into "extended"
#
# `secret` env vars are emitted as platform-native env-var references; never
# inline secrets in this file.

servers:
  gitlab:
    tags: [core]
    transport: stdio
    command: npx
    args: ["-y", "@zereight/mcp-gitlab"]
    env:
      GITLAB_PERSONAL_ACCESS_TOKEN: { fromEnv: GITLAB_PERSONAL_ACCESS_TOKEN, secret: true }
      GITLAB_API_URL: { fromEnv: GITLAB_API_URL }

  playwright:
    tags: [core]
    transport: stdio
    command: npx
    args: ["-y", "@playwright/mcp@latest"]

  fetch:
    tags: [core]
    transport: stdio
    command: npx
    args: ["-y", "mcp-fetch-server"]

  memory:
    tags: [core]
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]

  sequential-thinking:
    tags: [core]
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]

  brave:
    tags: [core]
    transport: stdio
    command: npx
    args: ["-y", "@brave/brave-search-mcp-server"]
    env:
      BRAVE_API_KEY: { fromEnv: BRAVE_API_KEY, secret: true }

  context7:
    tags: [core]
    transport: remote
    url: "https://mcp.context7.com/mcp"

  hindsight:
    tags: [core]
    transport: remote
    url: { fromEnv: HINDSIGHT_MCP_URL }

  cwso:
    tags: [extended]
    transport: remote
    url: { fromEnv: CWSO_MCP_URL }
    headers:
      Authorization: { fromEnv: CWSO_BEARER_TOKEN, secret: true, wrap: "Bearer {VAR}" }
      Origin: { fromEnv: CWSO_ORIGIN }

  hf-mcp-server:
    tags: [extended]
    transport: remote
    url: "https://huggingface.co/mcp?login"

  context-retriever:
    # T495 -- dedicated single-tool server wrapping ContextRetriever.query(), per
    # docs/artifacts/scoped-execution-primitive-v1.md §1.4. `extended`, not `core`: this is
    # narrowly-scoped infrastructure for one specific subagent (@context-retriever), not a
    # general-purpose server every platform profile needs unconditionally -- disclosed and
    # reasoned in the T495 MR description, mirroring how `hindsight`'s memory-layer access
    # is scoped similarly narrow in intent even though it happens to be tagged `core` today.
    # `--platform-root .claude` is a disclosed, Claude-Code-specific default today (per
    # scoped-execution-primitive-v1.md §4's own honest per-platform scoping) -- other
    # platforms' `.generated-manifest.json` resolution is not solved by this entry.
    tags: [extended]
    transport: stdio
    command: python3
    args: ["-m", "implementation.runtime.memory.context_retriever_mcp_server", "--index-dir", "implementation/runtime/memory/_index/em-age-emage.code", "--workspace-root", ".", "--platform-root", ".claude"]

  security-audit:
    # T497 -- fixed-command audit-command server for @security-engineer, per
    # docs/artifacts/security-engineer-audit-server-design-v1.md (T496) §3. `extended`,
    # not `core`: opt-in, role-specific infrastructure (only @security-engineer is ever
    # granted its tools), same reasoning class as `filesystem`/`git`/`docker`. No `env:`
    # block: every one of its four tools (run_npm_audit, run_pip_audit,
    # run_dotnet_list_vulnerable, grep_content) is a local CLI subprocess call against the
    # calling agent's own workspace -- no network call, no API key.
    tags: [extended]
    transport: stdio
    command: python3
    args: ["-m", "implementation.runtime.security.audit_server"]

  filesystem:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "@anthropic/mcp-filesystem"]

  github:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "@github/mcp-github"]

  git:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/mcp-git"]

  supabase:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "@supabase/mcp"]

  docker:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "docker-mcp"]

  postgresql:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "postgres-mcp"]

  toolradar:
    tags: [extended]
    transport: stdio
    command: npx
    args: ["-y", "toolradar-mcp"]
    env:
      # SECURITY: never inline a real key here. Set TOOLRADAR_API_KEY in your shell
      # or your platform's secret store. v1 leaked a live key — do not repeat.
      TOOLRADAR_API_KEY: { fromEnv: TOOLRADAR_API_KEY, secret: true }
